<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinicius Soares Brandão | Portfolio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=JetBrains+Mono:wght@300;400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#d6b25e;
    font-family:'JetBrains Mono', monospace;
    overflow:hidden;
}

/* ================= FUNDO LUXO ================= */

.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 20%, rgba(214,178,94,0.12), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(214,178,94,0.08), transparent 45%),
        radial-gradient(circle at center, #000, #050505);
    z-index:0;
}

/* luz dourada viva */
.glow{
    position:fixed;
    width:600px;
    height:600px;
    background: radial-gradient(circle, rgba(214,178,94,0.15), transparent 60%);
    filter:blur(70px);
    animation:float 10s infinite ease-in-out;
    z-index:1;
}

.glow2{
    position:fixed;
    width:500px;
    height:500px;
    background: radial-gradient(circle, rgba(214,178,94,0.08), transparent 60%);
    bottom:-200px;
    right:-200px;
    filter:blur(80px);
    animation:float2 12s infinite ease-in-out;
    z-index:1;
}

@keyframes float{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(60px,40px);}
}

@keyframes float2{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-60px,-50px);}
}

/* vinheta cinematográfica */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9) 100%);
    z-index:2;
    pointer-events:none;
}

/* ================= CODE RAIN ================= */

.code-rain{
    position:fixed;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
    opacity:0.15;
}

.code-rain span{
    position:absolute;
    top:-100px;
    color:rgba(214,178,94,0.35);
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    animation:fall linear infinite;
    text-shadow:0 0 8px rgba(214,178,94,0.1);
}

@keyframes fall{
    0%{
        transform:translateY(-100px);
        opacity:0;
    }
    10%{opacity:0.4;}
    100%{
        transform:translateY(110vh);
        opacity:0;
    }
}

/* ================= CONTEÚDO ================= */

.container{
    position:relative;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:3;
}

h1{
    font-family:'Playfair Display';
    font-size:3.2rem;
    letter-spacing:2px;
    animation:fadeIn 2s forwards;
}

h2{
    margin-top:10px;
    font-weight:300;
    color:#b89a55;
    animation:fadeIn 2.5s forwards;
}

.line{
    margin-top:20px;
    font-size:0.9rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#8a6d2f;
    animation:fadeIn 3s forwards;
}

.typing{
    margin-top:25px;
    font-size:0.95rem;
    border-right:2px solid #d6b25e;
    white-space:nowrap;
    overflow:hidden;
    width:0;
    animation:typing 4s steps(60,end) forwards, blink .8s infinite;
}

@keyframes typing{
    to{width:520px;}
}

@keyframes blink{
    50%{border-color:transparent;}
}

.cards{
    margin-top:50px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    width:220px;
    padding:18px;
    background:rgba(0,0,0,0.6);
    border:1px solid rgba(214,178,94,0.25);
    backdrop-filter:blur(12px);
    animation:cardIn 1s forwards;
}

.card:nth-child(1){animation-delay:3.5s;}
.card:nth-child(2){animation-delay:3.7s;}
.card:nth-child(3){animation-delay:3.9s;}
.card:nth-child(4){animation-delay:4.1s;}

@keyframes cardIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

a{
    margin-top:40px;
    padding:12px 28px;
    border:1px solid #d6b25e;
    color:#d6b25e;
    text-decoration:none;
    letter-spacing:3px;
    font-size:0.75rem;
    transition:0.4s;
    animation:fadeIn 1s forwards;
    animation-delay:4.5s;
}

a:hover{
    background:#d6b25e;
    color:#000;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="glow"></div>
<div class="glow2"></div>

<!-- FUNDO DE CÓDIGO -->
<div class="code-rain"></div>

<div class="container">

    <h1>Vinicius Soares Brandão</h1>
    <h2>Data Analytics • Business Intelligence • Python</h2>

    <div class="line">PORTFOLIO DIGITAL</div>

    <div class="typing">
        Transformando dados em decisões estratégicas...
    </div>

    <div class="cards">
        <div class="card">📍 São Paulo, Brasil</div>
        <div class="card">💼 Setor Administrativo</div>
        <div class="card">🎯 Data Analyst / BI</div>
        <div class="card">🧠 Python • SQL • Data</div>
    </div>

    <a href="https://github.com/" target="_blank">
        VER REPOSITÓRIOS
    </a>

</div>

<script>
const container = document.querySelector(".code-rain");

const chars = "01{}[]<>/\\|=+-*#@$%^&";

function createDrop(){
    const span = document.createElement("span");

    span.innerText = Array.from(
        {length: Math.floor(Math.random()*14)+6},
        () => chars[Math.floor(Math.random()*chars.length)]
    ).join("");

    span.style.left = Math.random() * 100 + "vw";
    span.style.animationDuration = (Math.random()*6 + 5) + "s";
    span.style.fontSize = (Math.random()*6 + 10) + "px";
    span.style.opacity = Math.random() * 0.25 + 0.08;

    container.appendChild(span);

    setTimeout(() => span.remove(), 11000);
}

setInterval(createDrop, 100);
</script>

</body>
</html>
