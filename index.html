<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=JetBrains+Mono:wght@300;400;600&display=swap');

/*
  Paleta old money:
  --gold-bright : #c9a84c  → dourado quente, usado no título principal
  --gold-mid    : #a8864a  → dourado médio, subtítulo e valores
  --gold-muted  : #7a6535  → dourado apagado elegante, labels e detalhes
  --gold-dim    : #4a3c20  → dourado escuro, bordas e glows
*/

*{margin:0;padding:0;box-sizing:border-box;}

body{
    background:#000;
    color:#a8864a;
    font-family:'JetBrains Mono', monospace;
    overflow:hidden;
}

.bg{
    position:fixed;width:100%;height:100%;
    background:
        radial-gradient(circle at 20% 20%, rgba(180,140,60,0.10), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(180,140,60,0.06), transparent 45%),
        radial-gradient(circle at center, #020100, #050403);
    z-index:0;
}

.glow{
    position:fixed;width:600px;height:600px;
    background:radial-gradient(circle, rgba(180,140,60,0.12), transparent 60%);
    filter:blur(70px);
    animation:float 10s infinite ease-in-out;
    z-index:1;
}

.glow2{
    position:fixed;width:500px;height:500px;
    background:radial-gradient(circle, rgba(180,140,60,0.07), transparent 60%);
    bottom:-200px;right:-200px;
    filter:blur(80px);
    animation:float2 12s infinite ease-in-out;
    z-index:1;
}

@keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(60px,40px);}}
@keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(-60px,-50px);}}

body::before{
    content:"";position:fixed;width:100%;height:100%;
    background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.92) 100%);
    z-index:2;pointer-events:none;
}

.code-rain{position:fixed;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0.18;}

.code-rain span{
    position:absolute;top:-100px;
    color:#7a6535;
    font-family:'JetBrains Mono';font-size:13px;
    animation:fall linear infinite;
}

@keyframes fall{
    0%{transform:translateY(-100px);opacity:0;}
    10%{opacity:1;}
    100%{transform:translateY(110vh);opacity:0;}
}

.container{
    position:relative;height:100vh;
    display:flex;flex-direction:column;
    justify-content:center;align-items:center;
    text-align:center;z-index:3;
}

.fade{opacity:0;transform:translateY(20px);animation:fadeIn 1s forwards;}
.delay1{animation-delay:0.3s;}
.delay2{animation-delay:0.6s;}
.delay3{animation-delay:0.9s;}
.delay4{animation-delay:1.2s;}
.delay5{animation-delay:1.5s;}

/* título: dourado mais rico, Playfair itálico para refinamento */
h1{
    font-family:'Playfair Display';
    font-size:3.2rem;
    letter-spacing:3px;
    color:#c9a84c;
    text-shadow: 0 0 60px rgba(180,140,60,0.25);
}

/* subtítulo: espaçamento mais arejado */
h2{
    margin-top:12px;
    font-weight:300;
    font-size:0.85rem;
    letter-spacing:4px;
    color:#7a6535;
}

.line{
    margin-top:22px;font-size:0.72rem;
    letter-spacing:5px;text-transform:uppercase;
    color:#4a3c20;
}

/* separador decorativo entre .line e .typing */
.divider{
    margin-top:18px;
    display:flex;align-items:center;gap:12px;
    color:#4a3c20;font-size:0.65rem;letter-spacing:2px;
}
.divider::before,.divider::after{
    content:"";display:block;width:60px;height:1px;
    background:linear-gradient(to right, transparent, #4a3c20, transparent);
}

.typing{
    margin-top:18px;font-size:0.88rem;
    color:#8a7040;
    border-right:1px solid #7a6535;
    white-space:nowrap;overflow:hidden;width:0;
    animation:typing 4s steps(60,end) forwards, blink 1s infinite;
}

@keyframes typing{to{width:480px;}}
@keyframes blink{50%{border-color:transparent;}}

.info{margin-top:50px;display:flex;flex-direction:column;gap:10px;align-items:center;}

.row{
    display:flex;justify-content:space-between;
    width:360px;padding:11px 0;
    border-bottom:1px solid rgba(120,90,40,0.18);
    transition:all 0.35s ease;cursor:default;
}

.row:hover{
    border-bottom:1px solid rgba(180,140,60,0.45);
    transform:translateX(8px);
}

.label{
    font-size:0.65rem;letter-spacing:3px;
    color:#4a3c20;text-transform:uppercase;
}

.value{
    font-size:0.88rem;
    color:#a8864a;
    letter-spacing:1px;
}

.social{
    margin-top:38px;display:flex;gap:28px;
    font-size:0.78rem;letter-spacing:2px;opacity:0.8;
}
.social a{
    color:#7a6535;text-decoration:none;
    border-bottom:1px solid transparent;transition:0.35s;
    text-transform:uppercase;
}
.social a:hover{color:#a8864a;border-bottom:1px solid #7a6535;}

.button{
    margin-top:42px;padding:11px 30px;
    border:1px solid #4a3c20;
    color:#7a6535;
    text-decoration:none;letter-spacing:4px;font-size:0.7rem;
    transition:0.4s;text-transform:uppercase;
}
.button:hover{
    border-color:#a8864a;
    color:#c9a84c;
}

@keyframes fadeIn{to{opacity:1;transform:translateY(0);}}
</style>

<body>
<div class="bg"></div>
<div class="glow"></div>
<div class="glow2"></div>
<div class="code-rain"></div>

<div class="container">

    <h1 class="fade delay1">Vinicius Soares Brandão</h1>
    <h2 class="fade delay2">Data Analytics &nbsp;•&nbsp; Business Intelligence &nbsp;•&nbsp; Python</h2>
    <div class="line fade delay2">Portfolio Digital</div>

    <div class="divider fade delay3">◆</div>

    <div class="typing fade delay3">
        Transformando dados em decisões estratégicas...

    <div class="info fade delay4">
        <div class="row"><span class="label">Local</span><span class="value">São Paulo, Brasil</span></div>

    </a>

</div>

<script>
let audioCtx = null;

function getCtx() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const buf = audioCtx.createBuffer(1, 1, audioCtx.sampleRate);
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        src.connect(audioCtx.destination);
        src.start(0);
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
}

document.addEventListener('click', () => getCtx(), { once: true });
document.addEventListener('touchstart', () => getCtx(), { once: true });

function playKeyClick() {
    const ctx = getCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const sr  = ctx.sampleRate;

    const crackLen = Math.floor(sr * 0.002);
    const crackBuf = ctx.createBuffer(1, crackLen, sr);
    const crackData = crackBuf.getChannelData(0);
    for (let i = 0; i < crackLen; i++) {
        let s = Math.max(-0.6, Math.min(0.6, (Math.random()*2-1)*3));
        crackData[i] = s * Math.pow(1 - i/crackLen, 2);
    }
    const crackSrc = ctx.createBufferSource(); crackSrc.buffer = crackBuf;
    const hp1 = ctx.createBiquadFilter(); hp1.type='highpass'; hp1.frequency.value=5000; hp1.Q.value=1.5;
    const hp2 = ctx.createBiquadFilter(); hp2.type='highpass'; hp2.frequency.value=4000; hp2.Q.value=2;
    const gCrack = ctx.createGain();
    gCrack.gain.setValueAtTime(1.2, now);
    gCrack.gain.exponentialRampToValueAtTime(0.001, now+0.004);
    crackSrc.connect(hp1); hp1.connect(hp2); hp2.connect(gCrack); gCrack.connect(ctx.destination);
    crackSrc.start(now);

    const bodyLen = Math.floor(sr * 0.006);
    const bodyBuf = ctx.createBuffer(1, bodyLen, sr);
    const bodyData = bodyBuf.getChannelData(0);
    for (let i = 0; i < bodyLen; i++) bodyData[i] = (Math.random()*2-1)*Math.pow(1-i/bodyLen,3);
    const bodySrc = ctx.createBufferSource(); bodySrc.buffer = bodyBuf;
    const bp = ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=4800; bp.Q.value=0.6;
    const gBody = ctx.createGain();
    gBody.gain.setValueAtTime(0.6, now+0.001);
    gBody.gain.exponentialRampToValueAtTime(0.001, now+0.010);
    bodySrc.connect(bp); bp.connect(gBody); gBody.connect(ctx.destination);
    bodySrc.start(now+0.001);

    const osc = ctx.createOscillator(); osc.type='sawtooth';
    osc.frequency.setValueAtTime(6500, now);
    osc.frequency.exponentialRampToValueAtTime(3200, now+0.008);
    const ws = ctx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i=0;i<256;i++){const x=(i*2)/256-1; curve[i]=(Math.PI+200)*x/(Math.PI+200*Math.abs(x));}
    ws.curve = curve;
    const gOsc = ctx.createGain();
    gOsc.gain.setValueAtTime(0.04, now);
    gOsc.gain.exponentialRampToValueAtTime(0.001, now+0.010);
    osc.connect(ws); ws.connect(gOsc); gOsc.connect(ctx.destination);
    osc.start(now); osc.stop(now+0.010);

    const botLen = Math.floor(sr * 0.010);
    const botBuf = ctx.createBuffer(1, botLen, sr);
    const botData = botBuf.getChannelData(0);
    for (let i=0;i<botLen;i++) botData[i]=(Math.random()*2-1)*Math.pow(1-i/botLen,5)*0.4;
    const botSrc = ctx.createBufferSource(); botSrc.buffer = botBuf;
    const lpBot = ctx.createBiquadFilter(); lpBot.type='lowpass'; lpBot.frequency.value=800;
    const gBot = ctx.createGain();
    gBot.gain.setValueAtTime(0.3, now+0.003);
    gBot.gain.exponentialRampToValueAtTime(0.001, now+0.015);
    botSrc.connect(lpBot); lpBot.connect(gBot); gBot.connect(ctx.destination);
    botSrc.start(now+0.003);
}

document.querySelectorAll('.row').forEach(row => {
    row.addEventListener('mouseenter', playKeyClick);
});

const rainContainer = document.querySelector(".code-rain");
const chars = [
    "import pandas as pd","df.groupby('região')","SELECT * FROM dados",
    "plt.show()","def analyze(df):","return df.describe()",
    "df.dropna(inplace=True)","fig, ax = plt.subplots()","WHERE receita > 0",
    "df['kpi'].mean()","JOIN vendas ON id","model.fit(X_train)",
    "df.to_csv('output.csv')","print(df.head())","ax.set_title('KPI')",
    "GROUP BY mes, ano","df.corr().round(2)","sns.heatmap(corr)",
    "ORDER BY data DESC","y_pred = model.predict(X)",
];

function createDrop(){
    const span = document.createElement("span");
    span.innerText = chars[Math.floor(Math.random()*chars.length)];
    span.style.left = Math.random()*100 + "vw";
    span.style.animationDuration = (Math.random()*6+5)+"s";
    span.style.opacity = Math.random()*0.2 + 0.08;
    span.style.fontSize = (Math.random() > 0.5 ? "12px" : "13px");
    rainContainer.appendChild(span);
    setTimeout(()=>span.remove(),11000);
}

setInterval(createDrop,120);
</script>

</body>
