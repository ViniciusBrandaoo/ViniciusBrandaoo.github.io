<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{

.bg{

.glow{

    z-index:1;

@keyframes float{0%,100%{transform:translate(0,0);}50%{transform:translate(60px,40px);}}
@keyframes float2{0%,100%{transform:translate(0,0);}50%{transform:translate(-60px,-50px);}}

body::before{
    content:"";position:fixed;width:100%;height:100%;

.code-rain{position:fixed;width:100%;height:100%;z-index:1;pointer-events:none;opacity:0.22;}

.code-rain span{

    font-family:'JetBrains Mono';font-size:14px;

}

@keyframes fall{
    0%{transform:translateY(-100px);opacity:0;}
    10%{opacity:0.6;}
    100%{transform:translateY(110vh);opacity:0;}
}

.container{

<script>
// AudioContext criado mas só destravado no primeiro clique/toque do usuário
let audioCtx = null;

function getCtx() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    // Resume caso esteja suspenso (política autoplay do browser)
    if (audioCtx.state === 'suspended') {
        audioCtx.resume();
    }
    return audioCtx;
}

// Destravar no primeiro gesto do usuário (qualquer lugar da página)
function unlockAudio() {
    getCtx();
    document.removeEventListener('click', unlockAudio);
    document.removeEventListener('touchstart', unlockAudio);
    document.removeEventListener('keydown', unlockAudio);
    document.removeEventListener('mousemove', unlockAudio);
}
document.addEventListener('click', unlockAudio);
document.addEventListener('touchstart', unlockAudio);
document.addEventListener('keydown', unlockAudio);
document.addEventListener('mousemove', unlockAudio, { once: true });

function playKeyClick() {
    const ctx = getCtx();
    if (!ctx || ctx.state === 'suspended') return;
    const now = ctx.currentTime;
    const sr  = ctx.sampleRate;

    // --- Camada 1: crack agudo inicial (2ms) ---
    const crackLen = Math.floor(sr * 0.002);
    const crackBuf = ctx.createBuffer(1, crackLen, sr);
    const crackData = crackBuf.getChannelData(0);
    for (let i = 0; i < crackLen; i++) {
        let s = (Math.random() * 2 - 1);
        s = Math.max(-0.6, Math.min(0.6, s * 3));
        crackData[i] = s * Math.pow(1 - i / crackLen, 2);
    }
    const crackSrc = ctx.createBufferSource();
    crackSrc.buffer = crackBuf;

    const hp1 = ctx.createBiquadFilter();
    hp1.type = 'highpass'; hp1.frequency.value = 5000; hp1.Q.value = 1.5;
    const hp2 = ctx.createBiquadFilter();
    hp2.type = 'highpass'; hp2.frequency.value = 4000; hp2.Q.value = 2;

    const gCrack = ctx.createGain();
    gCrack.gain.setValueAtTime(3.5, now);
    gCrack.gain.exponentialRampToValueAtTime(0.001, now + 0.004);

    crackSrc.connect(hp1); hp1.connect(hp2); hp2.connect(gCrack);
    gCrack.connect(ctx.destination);
    crackSrc.start(now);

    // --- Camada 2: corpo band-pass ~5kHz (6ms) ---
    const bodyLen = Math.floor(sr * 0.006);
    const bodyBuf = ctx.createBuffer(1, bodyLen, sr);
    const bodyData = bodyBuf.getChannelData(0);
    for (let i = 0; i < bodyLen; i++) {
        bodyData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bodyLen, 3);
    }
    const bodySrc = ctx.createBufferSource();
    bodySrc.buffer = bodyBuf;

    const bp = ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 4800; bp.Q.value = 0.6;

    const gBody = ctx.createGain();
    gBody.gain.setValueAtTime(1.8, now + 0.001);
    gBody.gain.exponentialRampToValueAtTime(0.001, now + 0.010);

    bodySrc.connect(bp); bp.connect(gBody);
    gBody.connect(ctx.destination);
    bodySrc.start(now + 0.001);

    // --- Camada 3: ping sawtooth saturado (10ms) ---
    const osc = ctx.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(6500, now);
    osc.frequency.exponentialRampToValueAtTime(3200, now + 0.008);

    const ws = ctx.createWaveShaper();
    const curve = new Float32Array(256);
    for (let i = 0; i < 256; i++) {
        const x = (i * 2) / 256 - 1;
        curve[i] = (Math.PI + 200) * x / (Math.PI + 200 * Math.abs(x));
    }
    ws.curve = curve;

    const gOsc = ctx.createGain();
    gOsc.gain.setValueAtTime(0.12, now);
    gOsc.gain.exponentialRampToValueAtTime(0.001, now + 0.010);

    osc.connect(ws); ws.connect(gOsc);
    gOsc.connect(ctx.destination);
    osc.start(now); osc.stop(now + 0.010);

    // --- Camada 4: bottom-out seco (10ms, delay 3ms) ---
    const botLen = Math.floor(sr * 0.010);
    const botBuf = ctx.createBuffer(1, botLen, sr);
    const botData = botBuf.getChannelData(0);
    for (let i = 0; i < botLen; i++) {
        botData[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / botLen, 5) * 0.4;
    }
    const botSrc = ctx.createBufferSource();
    botSrc.buffer = botBuf;

    const lpBot = ctx.createBiquadFilter();
    lpBot.type = 'lowpass'; lpBot.frequency.value = 800;

    const gBot = ctx.createGain();
    gBot.gain.setValueAtTime(0.9, now + 0.003);
    gBot.gain.exponentialRampToValueAtTime(0.001, now + 0.015);

    botSrc.connect(lpBot); lpBot.connect(gBot);
    gBot.connect(ctx.destination);
    botSrc.start(now + 0.003);
}

document.querySelectorAll('.row').forEach(row => {
    row.addEventListener('mouseenter', playKeyClick);
});

// ================= CODE RAIN =================
const rainContainer = document.querySelector(".code-rain");

const chars = [
    "import pandas as pd","df.groupby('região')","SELECT * FROM dados",
    "plt.show()","def analyze(df):","return df.describe()",
    "df.dropna(inplace=True)","fig, ax = plt.subplots()","WHERE receita > 0",
    "df['kpi'].mean()","JOIN vendas ON id","model.fit(X_train)",
    "df.to_csv('output.csv')","print(df.head())","ax.set_title('KPI')",
    "GROUP BY mes, ano","df.corr().round(2)","sns.heatmap(corr)",
    "ORDER BY data DESC","y_pred = model.predict(X)",
];

function createDrop(){
    const span = document.createElement("span");
    span.innerText = chars[Math.floor(Math.random()*chars.length)];
    span.style.left = Math.random()*100 + "vw";
    span.style.animationDuration = (Math.random()*6+5)+"s";
    span.style.opacity = Math.random()*0.25 + 0.1;
    span.style.fontSize = (Math.random() > 0.5 ? "12px" : "13px");
    rainContainer.appendChild(span);
    setTimeout(()=>span.remove(),11000);
}

setInterval(createDrop,120);
</script>
