<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinicius Soares Brandão | Portfolio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=JetBrains+Mono:wght@300;400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#d6b25e;
    font-family:'JetBrains Mono', monospace;
    overflow:hidden;
}

/* ===== BACKGROUND CINEMATICO ===== */

.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 20%, rgba(214,178,94,0.12), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(214,178,94,0.08), transparent 45%),
        radial-gradient(circle at center, #000, #050505);
}

.glow{
    position:fixed;
    width:600px;
    height:600px;
    background: radial-gradient(circle, rgba(214,178,94,0.12), transparent 60%);
    filter:blur(60px);
    animation:float 10s infinite ease-in-out;
}

.glow2{
    position:fixed;
    width:500px;
    height:500px;
    background: radial-gradient(circle, rgba(214,178,94,0.08), transparent 60%);
    bottom:-200px;
    right:-200px;
    filter:blur(70px);
    animation:float2 12s infinite ease-in-out;
}

@keyframes float{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(60px,40px);}
}

@keyframes float2{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-60px,-50px);}
}

/* scanlines elegantes */
body::after{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02),
        transparent 2px,
        transparent 5px
    );
    opacity:0.12;
    pointer-events:none;
}

/* ===== CONTEÚDO ===== */

.container{
    position:relative;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:2;
}

/* NOME */
h1{
    font-family:'Playfair Display';
    font-size:3.2rem;
    letter-spacing:2px;
    opacity:0;
    animation:fadeIn 2s forwards;
}

/* SUB */
h2{
    margin-top:10px;
    font-weight:300;
    color:#b89a55;
    opacity:0;
    animation:fadeIn 2.5s forwards;
}

/* LINHA ESTILO LUXO */
.line{
    margin-top:20px;
    font-size:0.9rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#8a6d2f;
    opacity:0;
    animation:fadeIn 3s forwards;
}

/* TYPING */
.typing{
    margin-top:25px;
    font-size:0.95rem;
    border-right:2px solid #d6b25e;
    white-space:nowrap;
    overflow:hidden;
    width:0;
    animation:typing 4s steps(60,end) forwards, blink .8s infinite;
}

@keyframes typing{
    to{width:520px;}
}

@keyframes blink{
    50%{border-color:transparent;}
}

/* CARDS */
.cards{
    margin-top:50px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    width:220px;
    padding:18px;
    background:rgba(0,0,0,0.6);
    border:1px solid rgba(214,178,94,0.25);
    backdrop-filter:blur(12px);
    opacity:0;
    transform:translateY(20px);
    animation:cardIn 1s forwards;
}

.card:nth-child(1){animation-delay:3.5s;}
.card:nth-child(2){animation-delay:3.7s;}
.card:nth-child(3){animation-delay:3.9s;}
.card:nth-child(4){animation-delay:4.1s;}

@keyframes cardIn{
    to{opacity:1; transform:translateY(0);}
}

.card:hover{
    transform:scale(1.05);
    border-color:#d6b25e;
}

/* BOTÃO */
a{
    margin-top:40px;
    padding:12px 28px;
    border:1px solid #d6b25e;
    color:#d6b25e;
    text-decoration:none;
    letter-spacing:3px;
    font-size:0.75rem;
    transition:0.4s;
    opacity:0;
    animation:fadeIn 1s forwards;
    animation-delay:4.5s;
}

a:hover{
    background:#d6b25e;
    color:#000;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="glow"></div>
<div class="glow2"></div>

<div class="container">

    <h1>Vinicius Soares Brandão</h1>
    <h2>Data Analytics • Business Intelligence • Python</h2>

    <div class="line">PORTFOLIO DIGITAL</div>

    <div class="typing">
        Transformando dados em decisões estratégicas...
    </div>

    <div class="cards">
        <div class="card">📍 São Paulo, Brasil</div>
        <div class="card">💼 Setor Administrativo</div>
        <div class="card">🎯 Data Analyst / BI</div>
        <div class="card">🧠 Python • SQL • Data</div>
    </div>

    <a href="https://github.com/" target="_blank">
        VER REPOSITÓRIOS
    </a>

</div>

</body>
</html>
