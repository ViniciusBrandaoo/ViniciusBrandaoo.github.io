<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinicius Soares Brandão | Portfolio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=JetBrains+Mono:wght@300;400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#d6b25e;
    font-family:'JetBrains Mono', monospace;
    overflow:hidden;
}

/* ================= BACKGROUND ================= */

.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 20%, rgba(214,178,94,0.12), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(214,178,94,0.08), transparent 45%),
        radial-gradient(circle at center, #000, #050505);
    z-index:0;
}

.glow{
    position:fixed;
    width:600px;
    height:600px;
    background: radial-gradient(circle, rgba(214,178,94,0.15), transparent 60%);
    filter:blur(70px);
    animation:float 10s infinite ease-in-out;
    z-index:1;
}

.glow2{
    position:fixed;
    width:500px;
    height:500px;
    background: radial-gradient(circle, rgba(214,178,94,0.08), transparent 60%);
    bottom:-200px;
    right:-200px;
    filter:blur(80px);
    animation:float2 12s infinite ease-in-out;
    z-index:1;
}

@keyframes float{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(60px,40px);}
}

@keyframes float2{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-60px,-50px);}
}

/* vinheta */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.9) 100%);
    z-index:2;
    pointer-events:none;
}

/* ================= CODE RAIN ================= */

.code-rain{
    position:fixed;
    width:100%;
    height:100%;
    z-index:1;
    pointer-events:none;
    opacity:0.14;
}

.code-rain span{
    position:absolute;
    top:-100px;
    color:rgba(214,178,94,0.35);
    font-family:'JetBrains Mono';
    font-size:14px;
    animation:fall linear infinite;
}

@keyframes fall{
    0%{transform:translateY(-100px); opacity:0;}
    10%{opacity:0.4;}
    100%{transform:translateY(110vh); opacity:0;}
}

/* ================= CONTAINER ================= */

.container{
    position:relative;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:3;
}

/* animação geral de entrada */
.fade{
    opacity:0;
    transform:translateY(20px);
    animation:fadeIn 1s forwards;
}

.delay1{animation-delay:0.3s;}
.delay2{animation-delay:0.6s;}
.delay3{animation-delay:0.9s;}
.delay4{animation-delay:1.2s;}
.delay5{animation-delay:1.5s;}

h1{
    font-family:'Playfair Display';
    font-size:3.2rem;
    letter-spacing:2px;
}

h2{
    margin-top:10px;
    font-weight:300;
    color:#b89a55;
}

.line{
    margin-top:20px;
    font-size:0.9rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#8a6d2f;
}

/* typing */
.typing{
    margin-top:25px;
    font-size:0.95rem;
    border-right:2px solid #d6b25e;
    white-space:nowrap;
    overflow:hidden;
    width:0;
    animation:typing 4s steps(60,end) forwards, blink .8s infinite;
}

@keyframes typing{to{width:520px;}}
@keyframes blink{50%{border-color:transparent;}}

/* ================= INFO CLEAN ================= */

.info{
    margin-top:55px;
    display:flex;
    flex-direction:column;
    gap:14px;
    align-items:center;
}

.row{
    display:flex;
    justify-content:space-between;
    width:340px;
    padding:10px 0;
    border-bottom:1px solid rgba(214,178,94,0.15);
    transition:0.3s;
}

.row:hover{
    border-bottom:1px solid rgba(214,178,94,0.5);
    transform:translateX(6px);
}

.label{
    font-size:0.7rem;
    letter-spacing:2px;
    color:#8a6d2f;
    text-transform:uppercase;
}

.value{
    font-size:0.9rem;
    color:#d6b25e;
}

/* ================= SOCIAL ================= */

.social{
    margin-top:40px;
    display:flex;
    gap:25px;
    font-size:0.85rem;
    opacity:0.9;
}

.social a{
    color:#d6b25e;
    text-decoration:none;
    border-bottom:1px solid transparent;
    transition:0.3s;
}

.social a:hover{
    border-bottom:1px solid #d6b25e;
}

/* ================= BOTÃO ================= */

.button{
    margin-top:45px;
    padding:12px 28px;
    border:1px solid #d6b25e;
    color:#d6b25e;
    text-decoration:none;
    letter-spacing:3px;
    font-size:0.75rem;
    transition:0.4s;
}

.button:hover{
    background:#d6b25e;
    color:#000;
}

/* ================= ANIMAÇÕES ================= */

@keyframes fadeIn{
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="glow"></div>
<div class="glow2"></div>

<div class="code-rain"></div>

<div class="container">

    <h1 class="fade delay1">Vinicius Soares Brandão</h1>
    <h2 class="fade delay2">Data Analytics • Business Intelligence • Python</h2>

    <div class="line fade delay3">PORTFOLIO DIGITAL</div>

    <div class="typing fade delay4">
        Transformando dados em decisões estratégicas...
    </div>

    <div class="info fade delay5">

        <div class="row">
            <span class="label">Local</span>
            <span class="value">São Paulo, Brasil</span>
        </div>

        <div class="row">
            <span class="label">Atual</span>
            <span class="value">Setor Administrativo</span>
        </div>

        <div class="row">
            <span class="label">Objetivo</span>
            <span class="value">Data Analyst / BI</span>
        </div>

        <div class="row">
            <span class="label">Stack</span>
            <span class="value">Python • SQL • Data</span>
        </div>

    </div>

    <div class="social fade delay5">
        <a href="https://instagram.com/viniciusbrandaoo" target="_blank">Instagram</a>
        <span>•</span>
        <a href="https://wa.me/5511988226487" target="_blank">WhatsApp</a>
    </div>

    <a class="button fade delay5" href="https://github.com/" target="_blank">
        VER REPOSITÓRIOS
    </a>

</div>

<script>
const container = document.querySelector(".code-rain");

const chars = "01{}[]<>/\\|=+-*#@$%^&";

function createDrop(){
    const span = document.createElement("span");

    span.innerText = Array.from(
        {length: Math.floor(Math.random()*14)+6},
        () => chars[Math.floor(Math.random()*chars.length)]
    ).join("");

    span.style.left = Math.random()*100 + "vw";
    span.style.animationDuration = (Math.random()*6+5)+"s";
    span.style.opacity = Math.random()*0.25 + 0.08;

    container.appendChild(span);

    setTimeout(()=>span.remove(),11000);
}

setInterval(createDrop,120);
</script>

</body>
</html>
