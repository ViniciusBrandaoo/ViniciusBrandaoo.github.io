<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Vinicius Soares Brandão | Portfolio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=JetBrains+Mono:wght@300;400;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}

body{
  background:#000;
  color:#d6b25e;
  font-family:'JetBrains Mono', monospace;
  overflow:hidden;
}

/* ===== PRISM BACKGROUND LAYER ===== */
#bg{
  position:fixed;
  inset:0;
  z-index:0;
}

/* vinheta 007 */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.9) 100%);
  z-index:1;
  pointer-events:none;
}

/* UI */
.container{
  position:relative;
  z-index:2;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

h1{
  font-family:'Playfair Display';
  font-size:3rem;
}

h2{
  margin-top:10px;
  color:#b89a55;
  font-weight:300;
}

.line{
  margin-top:15px;
  letter-spacing:4px;
  color:#8a6d2f;
  font-size:0.8rem;
}

.typing{
  margin-top:25px;
  border-right:2px solid #d6b25e;
  overflow:hidden;
  white-space:nowrap;
  width:0;
  animation:typing 3.5s steps(50,end) forwards, blink .8s infinite;
}

@keyframes typing{to{width:420px;}}
@keyframes blink{50%{border-color:transparent;}}

/* info clean */
.info{
  margin-top:45px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.row{
  width:340px;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid rgba(214,178,94,0.2);
  padding:8px 0;
}

.label{font-size:0.7rem;color:#8a6d2f;}
.value{font-size:0.9rem;}

.social{
  margin-top:30px;
  display:flex;
  gap:20px;
}

.social a{
  color:#d6b25e;
  text-decoration:none;
}

.btn{
  margin-top:40px;
  padding:12px 26px;
  border:1px solid #d6b25e;
  color:#d6b25e;
  text-decoration:none;
}
.btn:hover{background:#d6b25e;color:#000;}
</style>
</head>

<body>

<div id="bg"></div>

<div class="container">

  <h1>Vinicius Soares Brandão</h1>
  <h2>Data Analytics • Business Intelligence • Python</h2>

  <div class="line">CLASSIFIED PORTFOLIO</div>

  <div class="typing">Acessando sistema seguro...</div>

  <div class="info">
    <div class="row"><span class="label">LOCAL</span><span class="value">São Paulo</span></div>
    <div class="row"><span class="label">SETOR</span><span class="value">Administrativo</span></div>
    <div class="row"><span class="label">FOCO</span><span class="value">Data Analyst / BI</span></div>
    <div class="row"><span class="label">STACK</span><span class="value">Python • SQL</span></div>
  </div>

  <div class="social">
    <a href="https://instagram.com/viniciusbrandaoo">Instagram</a>
    <a href="https://wa.me/5511988226487">WhatsApp</a>
  </div>

  <a class="btn" href="https://github.com/">VER REPOSITÓRIOS</a>

</div>

<!-- ================= PRISM REAL (OGL) ================= -->
<script src="https://cdn.jsdelivr.net/npm/ogl@0.0.32/dist/ogl.umd.js"></script>

<script>
const { Renderer, Program, Mesh, Triangle } = OGL;

const container = document.getElementById("bg");

const renderer = new Renderer({ dpr: 2 });
const gl = renderer.gl;
container.appendChild(gl.canvas);

gl.clearColor(0,0,0,1);

const geometry = new Triangle(gl);

const vertex = `
attribute vec2 position;
void main() {
  gl_Position = vec4(position, 0.0, 1.0);
}
`;

const fragment = `
precision highp float;
uniform float uTime;

void main(){
  vec2 uv = gl_FragCoord.xy / 800.0;

  float wave =
    sin(uv.x * 10.0 + uTime) *
    cos(uv.y * 10.0 - uTime);

  vec3 gold = vec3(0.84,0.7,0.35);

  float glow = smoothstep(0.2,0.8,wave);

  gl_FragColor = vec4(gold * glow * 0.6, glow * 0.25);
}
`;

const program = new Program(gl, {
  vertex,
  fragment,
  uniforms:{
    uTime:{value:0}
  }
});

const mesh = new Mesh(gl, { geometry, program });

function resize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener("resize", resize);
resize();

let t = 0;

function animate(){
  t += 0.01;
  program.uniforms.uTime.value = t;

  renderer.render({ scene: mesh });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
