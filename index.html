<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinicius Soares Brandão | Portfolio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Inter', sans-serif;
}

body{
    background: radial-gradient(circle at top, #0f0c29, #0b0b12, #000);
    color:#fff;
    overflow-x:hidden;
}

/* glow background */
.glow{
    position:fixed;
    width:600px;
    height:600px;
    background: radial-gradient(circle, rgba(36,198,220,0.15), transparent 70%);
    top:-100px;
    left:-100px;
    filter: blur(40px);
    animation: float 8s infinite ease-in-out;
}

.glow2{
    position:fixed;
    width:500px;
    height:500px;
    background: radial-gradient(circle, rgba(139,92,246,0.15), transparent 70%);
    bottom:-120px;
    right:-120px;
    filter: blur(40px);
    animation: float2 10s infinite ease-in-out;
}

@keyframes float{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(80px,40px);}
}

@keyframes float2{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-80px,-40px);}
}

/* container */
.container{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    text-align:center;
    padding:20px;
}

/* title */
h1{
    font-size:3rem;
    font-weight:800;
    letter-spacing:2px;
    opacity:0;
    animation:fadeIn 1.5s forwards;
}

h2{
    font-weight:400;
    margin-top:10px;
    color:#c9d1d9;
    opacity:0;
    animation:fadeIn 2s forwards;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* typing effect */
.typing{
    margin-top:20px;
    font-size:1.1rem;
    color:#24c6dc;
    border-right:2px solid #24c6dc;
    white-space:nowrap;
    overflow:hidden;
    width:0;
    animation:typing 4s steps(40,end) forwards, blink .8s infinite;
}

@keyframes typing{
    from{width:0;}
    to{width:320px;}
}

@keyframes blink{
    50%{border-color:transparent;}
}

/* cards */
.cards{
    margin-top:50px;
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
    opacity:0;
    animation:fadeIn 2.5s forwards;
}

.card{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    padding:20px;
    border-radius:12px;
    width:250px;
    backdrop-filter: blur(10px);
    transition:0.3s;
}

.card:hover{
    transform:translateY(-10px);
    border-color:#24c6dc;
}

/* button */
a{
    margin-top:40px;
    text-decoration:none;
    color:#fff;
    padding:12px 24px;
    border:1px solid #24c6dc;
    border-radius:8px;
    transition:0.3s;
}

a:hover{
    background:#24c6dc;
    color:#000;
}
</style>
</head>

<body>

<div class="glow"></div>
<div class="glow2"></div>

<div class="container">

    <h1>Vinicius Soares Brandão</h1>
    <h2>Data Analytics • Business Intelligence • Python</h2>

    <div class="typing">Transformando dados em decisões...</div>

    <div class="cards">
        <div class="card">
            <h3>📍 Local</h3>
            <p>São Paulo, Brasil</p>
        </div>

        <div class="card">
            <h3>💼 Atual</h3>
            <p>Setor Administrativo</p>
        </div>

        <div class="card">
            <h3>🎯 Objetivo</h3>
            <p>Data Analyst / BI</p>
        </div>

        <div class="card">
            <h3>🐍 Foco</h3>
            <p>Python • SQL • Dados</p>
        </div>
    </div>

    <a href="https://github.com/" target="_blank">Ver meus repositórios</a>

</div>

<script>
// efeito de partículas simples
const canvas = document.createElement("canvas");
document.body.appendChild(canvas);
canvas.style.position = "fixed";
canvas.style.top = 0;
canvas.style.left = 0;
canvas.style.zIndex = 1;
canvas.style.opacity = 0.2;

const ctx = canvas.getContext("2d");

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

window.addEventListener("resize", () => {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
});

let particles = [];

for(let i=0;i<80;i++){
    particles.push({
        x: Math.random()*w,
        y: Math.random()*h,
        r: Math.random()*2,
        dx: (Math.random()-0.5),
        dy: (Math.random()-0.5)
    });
}

function draw(){
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = "#24c6dc";

    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;

        if(p.x<0||p.x>w) p.dx*=-1;
        if(p.y<0||p.y>h) p.dy*=-1;
    });

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
