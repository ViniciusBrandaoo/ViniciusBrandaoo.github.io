<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinicius Soares Brandão | 007 Portfolio</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background: radial-gradient(circle at top, #111 0%, #000 60%);
    color:#d6b25e;
    font-family:'Inter', sans-serif;
    overflow:hidden;
}

/* GOLD LUXURY GLOW */
.glow{
    position:fixed;
    width:700px;
    height:700px;
    background: radial-gradient(circle, rgba(214,178,94,0.15), transparent 60%);
    top:-150px;
    left:-150px;
    filter: blur(60px);
    animation: float 10s ease-in-out infinite;
}

.glow2{
    position:fixed;
    width:600px;
    height:600px;
    background: radial-gradient(circle, rgba(214,178,94,0.08), transparent 70%);
    bottom:-200px;
    right:-200px;
    filter: blur(80px);
    animation: float2 12s ease-in-out infinite;
}

@keyframes float{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(60px,40px);}
}

@keyframes float2{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-60px,-40px);}
}

/* CENTER */
.container{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

/* TITLE */
h1{
    font-family:'Playfair Display', serif;
    font-size:3.5rem;
    letter-spacing:2px;
    color:#d6b25e;
    opacity:0;
    animation:fadeIn 1.5s forwards;
}

h2{
    margin-top:10px;
    font-weight:300;
    color:#b89a55;
    opacity:0;
    animation:fadeIn 2s forwards;
}

/* SUBTITLE LINE */
.line{
    margin-top:20px;
    font-size:1rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#8a6d2f;
    animation:fadeIn 2.5s forwards;
}

/* CARDS */
.cards{
    margin-top:50px;
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
    opacity:0;
    animation:fadeIn 3s forwards;
}

.card{
    width:240px;
    padding:20px;
    border:1px solid rgba(214,178,94,0.2);
    background:rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    border-radius:10px;
    transition:0.4s;
    color:#d6b25e;
}

.card:hover{
    transform:translateY(-10px);
    border-color:#d6b25e;
    box-shadow:0 0 25px rgba(214,178,94,0.2);
}

/* BUTTON */
a{
    margin-top:40px;
    padding:12px 26px;
    border:1px solid #d6b25e;
    color:#d6b25e;
    text-decoration:none;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:0.8rem;
    transition:0.4s;
}

a:hover{
    background:#d6b25e;
    color:#000;
}

/* FADE */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

/* GOLD PARTICLES */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:1;
    opacity:0.25;
}
</style>
</head>

<body>

<div class="glow"></div>
<div class="glow2"></div>

<div class="container">

    <h1>Vinicius Soares Brandão</h1>
    <h2>Data Analytics • Business Intelligence • Python</h2>

    <div class="line">CLASSIFIED 007 PROFILE</div>

    <div class="cards">
        <div class="card">
            📍 São Paulo, Brasil
        </div>

        <div class="card">
            💼 Setor Administrativo
        </div>

        <div class="card">
            🎯 Data Analyst / BI
        </div>

        <div class="card">
            🧠 Python • SQL • Data
        </div>
    </div>

    <a href="https://github.com/" target="_blank">Access Repositories</a>

</div>

<script>
// GOLD PARTICLES (ELEGANT MODE)
const canvas = document.createElement("canvas");
document.body.appendChild(canvas);
const ctx = canvas.getContext("2d");

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

window.addEventListener("resize",()=>{
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
});

let particles = [];

for(let i=0;i<70;i++){
    particles.push({
        x: Math.random()*w,
        y: Math.random()*h,
        r: Math.random()*1.8,
        dx:(Math.random()-0.5)*0.3,
        dy:(Math.random()-0.5)*0.3
    });
}

function draw(){
    ctx.clearRect(0,0,w,h);

    ctx.fillStyle = "#d6b25e";

    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;

        if(p.x<0||p.x>w) p.dx*=-1;
        if(p.y<0||p.y>h) p.dy*=-1;
    });

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
