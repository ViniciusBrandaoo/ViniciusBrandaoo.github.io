<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MI6 CLASSIFIED ACCESS // Vinicius Brandão</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=JetBrains+Mono:wght@300;400;600&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    color:#d6b25e;
    font-family:'JetBrains Mono', monospace;
    overflow:hidden;
}

/* ===== BACKGROUND LAYERS ===== */

.bg{
    position:fixed;
    width:100%;
    height:100%;
    background:
      radial-gradient(circle at top, rgba(214,178,94,0.08), transparent 40%),
      radial-gradient(circle at bottom, rgba(214,178,94,0.05), transparent 60%),
      linear-gradient(180deg, #000, #050505);
    z-index:0;
}

/* scanlines */
.bg::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.02),
        rgba(255,255,255,0.02) 1px,
        transparent 1px,
        transparent 3px
    );
    opacity:0.2;
}

/* subtle noise */
.noise{
    position:fixed;
    width:100%;
    height:100%;
    background:url('https://grainy-gradients.vercel.app/noise.svg');
    opacity:0.06;
    z-index:1;
}

/* floating gold orbs */
.orb{
    position:fixed;
    width:500px;
    height:500px;
    background:radial-gradient(circle, rgba(214,178,94,0.15), transparent 60%);
    filter:blur(60px);
    animation:float 10s infinite ease-in-out;
    z-index:1;
}

.orb2{
    bottom:-200px;
    right:-200px;
    animation:float2 12s infinite ease-in-out;
}

@keyframes float{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(80px,40px);}
}

@keyframes float2{
    0%,100%{transform:translate(0,0);}
    50%{transform:translate(-80px,-60px);}
}

/* ===== MAIN ===== */

.container{
    position:relative;
    z-index:2;
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

/* TITLE */
h1{
    font-family:'Playfair Display', serif;
    font-size:3.2rem;
    letter-spacing:2px;
    opacity:0;
    animation:fadeIn 2s forwards;
}

h2{
    margin-top:10px;
    font-weight:300;
    color:#b89a55;
    opacity:0;
    animation:fadeIn 2.5s forwards;
}

/* TERMINAL */
.terminal{
    margin-top:25px;
    font-size:1rem;
    color:#d6b25e;
    border-right:2px solid #d6b25e;
    white-space:nowrap;
    overflow:hidden;
    width:0;
    animation:typing 4s steps(60,end) forwards, blink .8s infinite;
}

@keyframes typing{
    from{width:0;}
    to{width:520px;}
}

@keyframes blink{
    50%{border-color:transparent;}
}

/* DOSSIER CARDS */
.cards{
    margin-top:50px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
    opacity:0;
    animation:show 3s forwards;
}

.card{
    width:230px;
    padding:18px;
    border:1px solid rgba(214,178,94,0.25);
    background:rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    transition:0.4s;
    position:relative;
    overflow:hidden;
}

.card::before{
    content:"";
    position:absolute;
    width:100%;
    height:2px;
    background:#d6b25e;
    top:0;
    left:-100%;
    animation:scan 3s infinite;
}

@keyframes scan{
    0%{left:-100%;}
    50%{left:100%;}
    100%{left:100%;}
}

.card:hover{
    transform:translateY(-8px);
    border-color:#d6b25e;
    box-shadow:0 0 25px rgba(214,178,94,0.2);
}

/* BUTTON */
a{
    margin-top:40px;
    padding:12px 28px;
    border:1px solid #d6b25e;
    color:#d6b25e;
    text-decoration:none;
    letter-spacing:3px;
    text-transform:uppercase;
    font-size:0.75rem;
    transition:0.4s;
}

a:hover{
    background:#d6b25e;
    color:#000;
}

/* FADE */
@keyframes fadeIn{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}

@keyframes show{
    to{opacity:1;}
}

/* canvas particles */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:1;
    opacity:0.25;
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="noise"></div>
<div class="orb orb2"></div>

<div class="container">

    <h1>AGENTE VINICIUS</h1>
    <h2>MI6 CLASSIFIED DATA ACCESS</h2>

    <div class="terminal">
        ACCESSING DATABASE... IDENTIDADE CONFIRMADA...
    </div>

    <div class="cards">
        <div class="card">📍 São Paulo / Brazil</div>
        <div class="card">💼 Operações Administrativas</div>
        <div class="card">🎯 Data Analyst / BI</div>
        <div class="card">🧠 Python • SQL • Intelligence</div>
    </div>

    <a href="https://github.com/" target="_blank">
        ACCESS REPOSITORIES
    </a>

</div>

<script>
// GOLD INTELLIGENCE PARTICLES
const canvas = document.createElement("canvas");
document.body.appendChild(canvas);

const ctx = canvas.getContext("2d");

let w = canvas.width = window.innerWidth;
let h = canvas.height = window.innerHeight;

window.addEventListener("resize",()=>{
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
});

let particles = [];

for(let i=0;i<90;i++){
    particles.push({
        x:Math.random()*w,
        y:Math.random()*h,
        r:Math.random()*1.5,
        dx:(Math.random()-0.5)*0.4,
        dy:(Math.random()-0.5)*0.4
    });
}

function animate(){
    ctx.clearRect(0,0,w,h);

    ctx.fillStyle = "#d6b25e";

    particles.forEach(p=>{
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;

        if(p.x<0||p.x>w) p.dx*=-1;
        if(p.y<0||p.y>h) p.dy*=-1;
    });

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
